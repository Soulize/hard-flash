<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页中国象棋 · AI vs AI / 玩家 vs AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>♟ 中国象棋</h1>
    <p class="subtitle">网页版 · 玩家 vs AI / AI vs AI</p>
  </header>

  <main class="layout">
    <section class="panel board-panel">
      <div class="toolbar">
        <div class="mode-tabs">
          <button id="mode-pvai" class="tab active">玩家 vs AI</button>
          <button id="mode-aiai" class="tab">AI vs AI</button>
        </div>
        <div class="controls">
          <select id="player-color" title="玩家执子">
            <option value="random" selected>随机执子</option>
            <option value="red">执红先手</option>
            <option value="black">执黑后手</option>
          </select>
          <select id="difficulty" title="AI 难度">
            <option value="easy">简单</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困难</option>
          </select>
          <button id="new-game" class="btn primary">新对局</button>
          <button id="undo-btn" class="btn" title="悔棋（玩家 vs AI）">悔棋</button>
          <button id="flip-btn" class="btn" title="翻转棋盘">翻转</button>
          <button id="pause-btn" class="btn hidden" title="暂停 AI vs AI">暂停</button>
        </div>
      </div>

      <div id="board-container" class="board-container">
        <div id="board" class="board" role="grid" aria-label="中国象棋棋盘">
          <!-- Board lines, palace diagonals and pieces are generated by JavaScript -->
        </div>
      </div>

      <div id="status" class="status">准备开始</div>
    </section>

    <aside class="panel side-panel">
      <h2>对局记录</h2>
      <div id="move-list" class="move-list">
        <p class="empty-hint">还没有走子记录。</p>
      </div>
      <h2>操作说明</h2>
      <ul class="help-list">
        <li><b>玩家 vs AI：</b>点击己方棋子，再点击目标位置走棋。</li>
        <li><b>AI vs AI：</b>自动轮流走棋，可随时暂停。</li>
        <li>局面被将时会提示“将军”。</li>
        <li>无子可走判负（困毙）；三次重复局面判和。</li>
      </ul>
    </aside>
  </main>

  <footer class="app-footer">
    纯 HTML/CSS/JavaScript 实现，无需外部依赖；素材使用程序生成的木质纹理。
  </footer>

  <script src="js/xiangqi.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
